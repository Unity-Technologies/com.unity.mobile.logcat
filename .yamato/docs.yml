build_docs:
  name: Build documentation
  agent:
    type: Unity::VM
    image: unity-docs-engineering/packagedocs-cli-build:latest
    flavor: b1.large
  commands:
    # packagedocs-cli does not fetch an Editor itself, it needs one passed via --unity-editor.
    - command: pip install unity-downloader-cli --index-url https://artifactory.prd.it.unity3d.com/artifactory/api/pypi/pypi/simple --upgrade
    - command: unity-downloader-cli -u 6000.0 -c editor --wait
    - command: npm install -g @docs-tools/packagedocs-cli --@docs-tools:registry=https://artifactory.prd.it.unity3d.com/artifactory/api/npm/docs-tools-npm/
      timeout: 20
      retries: 5
    - command: packagedocs-cli build --unity-editor .Editor/Unity --package-path com.unity.mobile.android-logcat --output docs~ --built-in-code-project-gen --validate --path-to-pmdt-status-output docs~/pmdt_status.json
  artifacts:
    # Open docs~/com.unity.mobile.android-logcat@<version>/manual/index.html from the downloaded zip.
    docs:
      paths:
        - "docs~/**/*"
  triggers:
    cancel_old_ci: true
    expression: pull_request.target eq "master" AND (pull_request.changes.any match "com.unity.mobile.android-logcat/Documentation~/**/*" OR pull_request.changes.any match "com.unity.mobile.android-logcat/**/*.cs")
