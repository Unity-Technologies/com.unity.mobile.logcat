// Build for the Unity Logcat on-device screen streaming server.
//
// The server is not an Android application: it has no manifest, no resources and
// no activity. It is a plain set of classes, dexed and archived into a jar, which
// is pushed to the device and executed by app_process as the `shell` user:
//
//   adb push unity-logcat-server.jar /data/local/tmp/
//   adb shell CLASSPATH=/data/local/tmp/unity-logcat-server.jar \
//       app_process / com.unity.android.logcat.server.Server
//
// Because of that, this uses the plain `java-library` plugin plus an explicit d8
// step instead of the Android Gradle Plugin. AGP would build an APK (which would
// then have to be renamed to a jar), pull in a large dependency tree and require
// network access to the `google()` repository - none of which buys us anything.
//
//   ./gradlew dexJar   -> build/outputs/unity-logcat-server.jar
//   ./gradlew pushJar  -> pushes it to the connected device
//   ./gradlew runJar   -> pushes and runs it (foreground, for manual testing)

plugins {
    id 'java-library'
}

// ---------------------------------------------------------------------------
// Android SDK discovery
// ---------------------------------------------------------------------------

def androidPlatform = project.property('androidPlatform')
def androidBuildTools = project.property('androidBuildTools')
def androidMinApi = project.property('androidMinApi')

def sdkHelp = """Android SDK not found. Point the build at one of:

  * External/UnityLogcatServer/local.properties  containing  sdk.dir=<path to sdk>
  * the ANDROID_HOME environment variable
  * the ANDROID_SDK_ROOT environment variable

A Unity installation with Android support ships one, typically at
<Unity>/Editor/Data/PlaybackEngines/AndroidPlayer/SDK.

The build needs platforms/android-${androidPlatform}/android.jar
and build-tools/${androidBuildTools}/d8."""

def resolveSdkDir = {
    def localProperties = file('local.properties')
    if (localProperties.exists()) {
        def props = new Properties()
        localProperties.withInputStream { props.load(it) }
        def dir = props.getProperty('sdk.dir')
        if (dir) {
            return file(dir)
        }
    }
    for (name in ['ANDROID_HOME', 'ANDROID_SDK_ROOT']) {
        def dir = System.getenv(name)
        if (dir) {
            return file(dir)
        }
    }
    return null
}

// Everything below resolves the SDK lazily, so that tasks which do not need it
// (`gradlew tasks`, `gradlew clean`) still work on a machine without one.
def sdkFile = { String relativePath ->
    def sdkDir = resolveSdkDir()
    if (sdkDir == null || !sdkDir.isDirectory()) {
        throw new GradleException(sdkHelp)
    }
    def f = new File(sdkDir, relativePath)
    if (!f.exists()) {
        throw new GradleException("Not found: " + f + "\n\n" + sdkHelp)
    }
    return f
}

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def androidJar = { sdkFile("platforms/android-${androidPlatform}/android.jar") }
// Needed on the compile classpath because we replace the bootclasspath with
// android.jar, which does not carry the JDK lambda metafactory stubs.
def lambdaStubs = { sdkFile("build-tools/${androidBuildTools}/core-lambda-stubs.jar") }
def d8 = { sdkFile("build-tools/${androidBuildTools}/d8" + (isWindows ? '.bat' : '')) }
def adb = { sdkFile('platform-tools/adb' + (isWindows ? '.exe' : '')) }

// ---------------------------------------------------------------------------
// Compilation
// ---------------------------------------------------------------------------

def generatedSrcDir = layout.buildDirectory.dir('generated/sources/buildconfig')

// Values the Editor side also needs to agree on live in gradle.properties and are
// baked into the jar, so a protocol mismatch is detectable at runtime instead of
// being two constants that silently drift apart.
def generateBuildConfig = tasks.register('generateBuildConfig') {
    description = 'Generates BuildConfig.java from gradle.properties'
    def outDir = generatedSrcDir
    def protocolVersion = project.property('serverProtocolVersion')
    def socketName = project.property('serverSocketName')
    inputs.property('protocolVersion', protocolVersion)
    inputs.property('socketName', socketName)
    outputs.dir(outDir)
    doLast {
        def pkgDir = new File(outDir.get().asFile, 'com/unity/android/logcat/server')
        pkgDir.mkdirs()
        new File(pkgDir, 'BuildConfig.java').text = [
            '// Generated by build.gradle from gradle.properties. Do not edit.',
            'package com.unity.android.logcat.server;',
            '',
            'public final class BuildConfig {',
            '    public static final int PROTOCOL_VERSION = ' + protocolVersion + ';',
            '    public static final String DEFAULT_SOCKET_NAME = "' + socketName + '";',
            '',
            '    private BuildConfig() {',
            '    }',
            '}',
            ''
        ].join('\n')
    }
}

sourceSets {
    main {
        java {
            srcDir generatedSrcDir
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn generateBuildConfig
    options.encoding = 'UTF-8'
    // Compile against android.jar rather than the JDK class library, so reaching
    // for a desktop-only API is a compile error instead of a crash on device.
    options.bootstrapClasspath = files(androidJar)
    classpath = files(lambdaStubs)
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
}

def classesJar = tasks.named('jar', Jar).flatMap { it.archiveFile }

jar {
    // Intermediate artifact only: plain .class files, not runnable on a device.
    archiveFileName = 'unity-logcat-server-classes.jar'
}

// ---------------------------------------------------------------------------
// Dexing: the actual deliverable
//
// These are typed Exec tasks whose command line is filled in at execution time,
// because the SDK is resolved lazily and because Gradle 9 removed the
// `project.exec {}` method that an ad-hoc task would otherwise have used.
// ---------------------------------------------------------------------------

def outputJar = layout.buildDirectory.file('outputs/unity-logcat-server.jar')

def dexJar = tasks.register('dexJar', Exec) {
    group = 'build'
    description = 'Dexes the compiled classes into build/outputs/unity-logcat-server.jar'
    // Declaring the jar as an input is also what makes this run after it.
    inputs.file(classesJar)
    outputs.file(outputJar)
    // d8 is a launcher script that resolves java through JAVA_HOME, so it breaks
    // on an unset JAVA_HOME and on the POSIX-style one a Git Bash shell carries.
    // Point it at the JVM Gradle is already running on, which is always a path
    // the platform's own shell understands.
    environment 'JAVA_HOME', System.getProperty('java.home')
    doFirst {
        def out = outputJar.get().asFile
        out.parentFile.mkdirs()
        // d8 writes an archive containing classes.dex when --output ends in .jar.
        commandLine d8(),
            '--release',
            '--min-api', androidMinApi,
            '--lib', androidJar(),
            '--output', out,
            classesJar.get().asFile
    }
    doLast {
        def out = outputJar.get().asFile
        logger.lifecycle("Server jar: " + out + " (" + out.length() + " bytes)")
    }
}

tasks.named('assemble') {
    dependsOn dexJar
}

// ---------------------------------------------------------------------------
// Developer conveniences. The Editor does its own push/run at runtime; these
// exist so the server can be exercised without an Editor in the loop.
// ---------------------------------------------------------------------------

def devicePath = project.property('serverDevicePath')

def pushJar = tasks.register('pushJar', Exec) {
    group = 'verification'
    description = "Pushes the server jar to ${devicePath} on the connected device"
    dependsOn dexJar
    doFirst {
        commandLine adb(), 'push', outputJar.get().asFile, devicePath
    }
}

tasks.register('runJar', Exec) {
    group = 'verification'
    description = 'Runs the server on the connected device in the foreground (Ctrl+C to stop)'
    dependsOn pushJar
    doFirst {
        def serverArgs = project.findProperty('serverArgs') ?: 'log_level=debug'
        commandLine adb(), 'shell',
            "CLASSPATH=${devicePath} app_process / com.unity.android.logcat.server.Server ${serverArgs}"
    }
}
