# Version of the wire protocol spoken between the Editor and the on-device server.
# The Editor refuses to talk to a server whose protocol version it does not know,
# so bump this whenever the packet layout in Protocol.java changes.
serverProtocolVersion=6

# Android platform the server is compiled against (android.jar is taken from
# $SDK/platforms/android-<androidPlatform>/android.jar).
androidPlatform=36

# Build tools providing d8 ($SDK/build-tools/<androidBuildTools>/d8).
androidBuildTools=36.0.0

# Lowest Android API level the produced dex must run on.
androidMinApi=24

# Name of the abstract-namespace unix socket the server listens on, and the
# on-device path the jar is pushed to. Kept here so the Editor-side constants
# have a single documented source.
serverSocketName=unity_logcat_server
serverDevicePath=/data/local/tmp/unity-logcat-server.jar

org.gradle.jvmargs=-Xmx1024m
